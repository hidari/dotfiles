[project]
name = "claude-hooks"
version = "0.1.0"
description = "home/.claude/hooks/ 配下の Claude Code フックの単体/統合テスト"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hidari" }]
dependencies = []

# フック本体は symlink 都合で home/.claude/hooks/ に置くため、
# このプロジェクトはインストール可能なパッケージを持たないテスト専用ハーネス。
# Python フックのテストは tests/ のファイル名が示す (.sh フックは shellcheck が見る)。
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# N802: pytest メソッド名を日本語の仕様文（テスト＝仕様）にするため、非ASCII識別子を
# 小文字判定できない ruff の誤検知を許容する。現行 pin の ruff でも再現する。
# 日本語名を持つファイルだけに限る。tests/* へ広げると ASCII の camelCase を見逃す。
"tests/test_guard_health.py" = ["N802"]
"tests/test_guard_probes.py" = ["N802"]
"tests/test_handoff_sentinel.py" = ["N802"]
"tests/test_instructions_loaded_log.py" = ["N802"]
"tests/test_pretooluse.py" = ["N802"]

[tool.mypy]
strict = true
python_version = "3.12"
# 共有モジュール pretooluse はフック本体と同じディレクトリにあり、tests から直接 import する。
# 実行時は sys.path[0] が解決するが mypy はそれを知らないので探索パスを明示する。
# 検査コマンドの cwd (このファイルのディレクトリ) からの相対で書く。
mypy_path = "../../home/.claude/hooks"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
