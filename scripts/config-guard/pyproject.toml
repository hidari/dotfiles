[project]
name = "config-guard"
version = "0.1.0"
description = "skills と committed settings.json の stale なツール名参照・構造逸脱を検出する静的ガード"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Hidari" }]
# src/config_guard/apm_pins.py が apm.yml / apm.lock.yaml を構造として読む。行パースは
# YAML のパーサが無視する要素を誤読するので使わない (グローバル CLAUDE.md の MUST)。
# ここへ足さずに src/ で import すると、dev グループを持つテスト環境だけが緑になり
# 配布側で ModuleNotFoundError になる (tests/test_dependency_declarations.py が pin する)
dependencies = ["pyyaml>=6.0"]

[project.scripts]
config-guard = "config_guard.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/config_guard"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
    # pyyaml 本体は [project] dependencies にある。ここは mypy 用の型スタブだけで、
    # 実行時には要らない
    "types-pyyaml>=6.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
# N802: pytest メソッド名を日本語の仕様文（テスト＝仕様）にするため、非ASCII識別子を
# 小文字判定できない ruff の誤検知を許容する。現行 pin の ruff でも再現する
# (scripts/claude-hooks/pyproject.toml で先に踏んだのと同じ現象)。
# 日本語名を持つファイルだけに限る。tests/* へ広げると ASCII の camelCase を見逃す。
"tests/test_settings_invariants.py" = ["N802"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests"]
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config"
testpaths = ["tests"]
pythonpath = ["src"]
