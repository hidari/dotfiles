name: Setup uv
description: astral-sh/setup-uv を SHA pin して呼び出すローカル composite action。pin を単一箇所へ集約し複数 job 間の drift を防ぐ。

runs:
  using: composite
  steps:
    # enable-cache は既定の auto に任せる。明示の true は、キャッシュ汚染を避けるために auto が
    # キャッシュを止めるイベント (pull_request_target など) でもキャッシュを使ってしまう
    # uv のマニフェスト (uv.ndjson) の取得は、接続の失敗なら setup-uv 自身がバックオフ付きで
    # 再試行するので、自前の再試行は足さない (HTTP のエラー応答は再試行されない)
    - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
