name: Setup gitleaks
description: gitleaks をバージョン pin した公式 tarball から取得し PATH に追加するローカル composite action。pin を単一箇所へ集約し複数 job 間の drift を防ぐ。

runs:
  using: composite
  steps:
    - name: Install gitleaks
      shell: bash
      run: |
        gitleaks_version="8.30.1" # 開発機と揃える
        # sha256 は展開前に内容を pin する堰。
        # 再計算方法: curl で同じ URL を取得し `shasum -a 256 gitleaks_<version>_linux_x64.tar.gz`
        # (macOS) または `sha256sum gitleaks_<version>_linux_x64.tar.gz` (Linux) を実行する。
        expected_sha256="551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        archive="$RUNNER_TEMP/gitleaks.tar.gz"
        "$GITHUB_WORKSPACE/scripts/ci/download-and-verify.sh" "https://github.com/gitleaks/gitleaks/releases/download/v${gitleaks_version}/gitleaks_${gitleaks_version}_linux_x64.tar.gz" "$expected_sha256" "$archive"
        bin_dir="$RUNNER_TEMP/gitleaks-bin"
        mkdir -p "$bin_dir"
        tar -xz -C "$bin_dir" -f "$archive" gitleaks
        echo "$bin_dir" >> "$GITHUB_PATH"
