# gitleaks 設定
# 既定の secret 検出ルールを継承しつつ、PII 検出の custom ルールを重ねる。
# 個々のルールが何を見るかは各 [[rules]] の description が正本なので、ここでは
# 列挙しない。pre-commit (staged 検査) と CI の双方が本設定を使用する。
title = "hidari-dotfiles gitleaks config"

[extend]
useDefault = true

[[rules]]
id = "macos-user-path"
description = "macOS のローカルユーザー名を含む絶対パス (/Users/<name>) の漏洩"
regex = '''/Users/[a-z_][a-z0-9._-]*'''
tags = ["pii", "path"]

  # placeholder / 共有・CI 用のユーザー名は許可する。
  # 境界 ([/."]|$) で /Users/user (許可) と /Users/userfoo (検出) を区別する。
  [rules.allowlist]
  description = "placeholder / 共有・CI 用パスは許可"
  # secret==match (capture group 無し) だが、境界判定の意図を明示するため match を指定
  regexTarget = "match"
  regexes = [
    '''/Users/(example|user|username|runner|shared)([/."]|$)''',
  ]

[[rules]]
id = "email-address"
description = "メールアドレスの漏洩"
regex = '''[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}'''
tags = ["pii", "email"]

  # 許可は 2 軸ある。ドメイン軸で文書用の例示アドレスを、ローカルパート軸で
  # SSH clone URL の git@ を通す。後者は個人を指さない。
  # ここを狭めすぎると、追跡下に既にある例示アドレスを含む行を触るたびに赤くなる。
  [rules.allowlist]
  description = "例示アドレスと SSH URL のユーザー名は許可"
  regexTarget = "match"
  regexes = [
    '''@example\.(com|org|net)$''',
    '''^git@''',
  ]
